name: Build 100m Android APK (Bubblewrap)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Google Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Paths
        run: |
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Create Keystore & TWA Manifest
        run: |
          mkdir -p twa-build
          cd twa-build
          keytool -genkeypair -v -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 100mPass123 -keypass 100mPass123 \
            -dname "CN=100m Network, OU=App, O=100m, L=IN, ST=AP, C=IN"

          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "app.vercel.network100m.twa",
            "host": "100m-network.vercel.app",
            "name": "100m Network",
            "launcherName": "100m.",
            "display": "standalone",
            "themeColor": "#09090B",
            "themeColorDark": "#09090B",
            "navigationColor": "#09090B",
            "navigationColorDark": "#09090B",
            "navigationDividerColor": "#09090B",
            "navigationDividerColorDark": "#09090B",
            "backgroundColor": "#09090B",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://100m-network.vercel.app/icon-512.png",
            "maskableIconUrl": "https://100m-network.vercel.app/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersion": "1.0.0",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://100m-network.vercel.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://100m-network.vercel.app/",
            "minSdkVersion": 24,
            "orientation": "portrait"
          }
          EOF

      - name: Generate Bubblewrap Project & Build Signed APK
        working-directory: twa-build
        run: |
          bubblewrap update --skipVersionUpgrade --skipPwaValidation
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$BT/zipalign" -f 4 "$RAW_APK" app-aligned.apk
          "$BT/apksigner" sign --ks android.keystore --ks-key-alias android \
            --ks-pass pass:100mPass123 --key-pass pass:100mPass123 \
            --out app-release-signed.apk app-aligned.apk
          SHA=$(keytool -list -v -keystore android.keystore -alias android -storepass 100mPass123 | grep "SHA256:" | awk '{print $2}')
          cat << EOF > assetlinks.json
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "app.vercel.network100m.twa",
              "sha256_cert_fingerprints": ["$SHA"]
            }
          }]
          EOF

      - name: Upload Ready APK & assetlinks.json
        uses: actions/upload-artifact@v4
        with:
          name: 100m-network-apk
          path: |
            twa-build/app-release-signed.apk
            twa-build/assetlinks.json
